# Runs the highlighter's tests on every push and pull request that touches it. On main, once
# they pass, copies the built userscript to a secret gist, because Violentmonkey cannot
# fetch updates from this private repo. The copy's @updateURL/@downloadURL are
# rewritten to the gist's raw URL, so installs from the gist update from the gist.
# The same file also goes to the gist as RoughNotationHighlighter.user.js, its name before 7.45,
# so copies installed from that URL keep updating (to the new URL, after one update).
# Needs repo secrets GIST_TOKEN (classic token with "gist" scope, or fine-grained with Gists: read and write) and GIST_ID.
name: Test, then mirror userscript to gist

on:
  push:
    paths: [highlighter/**, .github/workflows/gist-mirror.yml]
  pull_request:
    paths: [highlighter/**, .github/workflows/gist-mirror.yml]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: highlighter/test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps --only-shell chromium
      - name: Run the tests
        run: node run.js

  # Only for main, once the tests pass.
  mirror:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Threads push to main in parallel, so runs can finish out of order: only the run for
      # the newest main commit writes the gist, and it always writes it, so an older run that
      # finishes last can neither overwrite a newer copy nor leave one out.
      - name: Is this still the newest main commit?
        id: latest
        run: |
          git fetch -q origin main
          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "main has moved on to $(git rev-parse --short origin/main); its own run updates the gist."
          fi
      - name: Is @version higher than before this push?
        if: steps.latest.outputs.yes == 'true' && github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          ver() { sed -n -E 's#^// @version[[:space:]]+([0-9.]+).*#\1#p'; }
          new=$(ver < highlighter/src/header.js)
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
            && ! git diff --quiet "$BEFORE" HEAD -- highlighter/Highlighter.user.js; then
            old=$(git show "$BEFORE:highlighter/src/header.js" | ver)
            if [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -1)" != "$new" ] || [ "$old" = "$new" ]; then
              echo "::error::@version $new is not higher than $old; Violentmonkey would not update. Bump it in src/header.js and rebuild."
              exit 1
            fi
          fi
      - name: Update gist
        if: steps.latest.outputs.yes == 'true'
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          OWNER: ${{ github.repository_owner }}
          FILE: Highlighter.user.js
          OLD_FILE: RoughNotationHighlighter.user.js
        run: |
          if [ -z "$GIST_TOKEN" ] || [ -z "$GIST_ID" ]; then
            echo "::error::Add the GIST_TOKEN and GIST_ID repo secrets first."
            exit 1
          fi
          # Accept a pasted gist URL as well as the bare ID.
          GIST_ID=$(printf '%s' "$GIST_ID" | tr -d '[:space:]' | sed -E 's/[#?].*//; s#/+$##; s#.*/##')
          url="https://gist.githubusercontent.com/$OWNER/$GIST_ID/raw/$FILE"
          sed -E "s#^(// @(update|download)URL[[:space:]]+).*#\1$url#" "highlighter/$FILE" > "$RUNNER_TEMP/$FILE"
          grep -q "@updateURL.*$GIST_ID" "$RUNNER_TEMP/$FILE"
          jq -n --rawfile c "$RUNNER_TEMP/$FILE" --arg f "$FILE" --arg o "$OLD_FILE" '{files: {($f): {content: $c}, ($o): {content: $c}}}' > "$RUNNER_TEMP/body.json"
          status=$(curl -sS -o "$RUNNER_TEMP/resp.json" -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $GIST_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            --data @"$RUNNER_TEMP/body.json" \
            "https://api.github.com/gists/$GIST_ID")
          if [ "$status" != 200 ]; then
            echo "::error::GitHub answered $status: $(jq -r '.message // empty' "$RUNNER_TEMP/resp.json")"
            [ "$status" = 404 ] && echo "::error::404 means the gist ID is wrong, or the token cannot write gists (fine-grained: Account permissions > Gists > Read and write)."
            exit 1
          fi
          echo "Install or update from: $url"
