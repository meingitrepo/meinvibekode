# Copies the built userscript to a secret gist, because Violentmonkey cannot
# fetch updates from this private repo. The copy's @updateURL/@downloadURL are
# rewritten to the gist's raw URL, so installs from the gist update from the gist.
# Needs repo secrets GIST_TOKEN (classic token, "gist" scope) and GIST_ID.
name: Mirror userscript to gist

on:
  push:
    branches: [main]
    paths: [rough-notation/RoughNotationHighlighter.user.js]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          OWNER: ${{ github.repository_owner }}
          FILE: RoughNotationHighlighter.user.js
        run: |
          if [ -z "$GIST_TOKEN" ] || [ -z "$GIST_ID" ]; then
            echo "::error::Add the GIST_TOKEN and GIST_ID repo secrets first."
            exit 1
          fi
          url="https://gist.githubusercontent.com/$OWNER/$GIST_ID/raw/$FILE"
          sed -E "s#^(// @(update|download)URL[[:space:]]+).*#\1$url#" "rough-notation/$FILE" > "$RUNNER_TEMP/$FILE"
          grep -q "@updateURL.*$GIST_ID" "$RUNNER_TEMP/$FILE"
          jq -n --rawfile c "$RUNNER_TEMP/$FILE" --arg f "$FILE" '{files: {($f): {content: $c}}}' > "$RUNNER_TEMP/body.json"
          curl -fsS -X PATCH \
            -H "Authorization: Bearer $GIST_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            --data @"$RUNNER_TEMP/body.json" \
            "https://api.github.com/gists/$GIST_ID" > /dev/null
          echo "Install or update from: $url"
